version: "3.8"

services:
  mininet:
    build: .
    container_name: mininet-dev
    privileged: true
    network_mode: host
    volumes:
      - ./projects:/app/projects
      - /lib/modules:/lib/modules:ro
    environment:
      # On macOS (Apple Silicon / Intel) Docker runs inside a Linux VM, so the
      # Unix X11 socket is not reachable from inside the container.
      # Use host.docker.internal:0 to reach XQuartz over TCP instead.
      # On Linux, override this with your actual $DISPLAY value.
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
    stdin_open: true
    tty: true
    command: /bin/bash
